<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
  <title id="title">Mapping software loop detection to the halting problem</title>
  <desc id="desc">A real program and input map to a Turing machine and input. The halt question is membership in HALT TM; timeout does not establish nontermination.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="1000" height="510" fill="white"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#172554">From a software question to a formal decision problem</text>
  <g font-family="Arial" font-size="18" text-anchor="middle" stroke="#475569" stroke-width="2">
    <rect x="70" y="100" width="350" height="100" rx="14" fill="#eff6ff"/><text x="245" y="140" stroke="none" fill="#172033">Real system</text><text x="245" y="174" stroke="none" fill="#172033">program P + input w</text>
    <rect x="580" y="100" width="350" height="100" rx="14" fill="#eff6ff"/><text x="755" y="140" stroke="none" fill="#172033">Formal encoding</text><text x="755" y="174" stroke="none" fill="#172033">machine M + string w</text>
    <rect x="230" y="270" width="540" height="86" rx="14" fill="#dcfce7"/><text x="500" y="306" stroke="none" fill="#172033">Does M halt on w?</text><text x="500" y="337" stroke="none" fill="#172033">⟨M,w⟩ ∈ HALT_TM</text>
    <rect x="110" y="410" width="310" height="66" rx="14" fill="#fef3c7"/><text x="265" y="450" stroke="none" fill="#172033">Timeout: still inconclusive</text>
    <rect x="580" y="410" width="310" height="66" rx="14" fill="#fee2e2"/><text x="735" y="450" stroke="none" fill="#172033">Universal exact decider: impossible</text>
  </g>
  <g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"><path d="M420 150 L575 150"/><path d="M755 200 C730 238 675 254 630 268"/><path d="M400 356 C370 380 330 394 310 407"/><path d="M600 356 C635 380 680 394 710 407"/></g>
  <g font-family="Arial" font-size="15" fill="#334155"><text x="481" y="135">encode</text><text x="326" y="389">finite waiting proves neither outcome</text><text x="672" y="389">diagonal argument</text></g>
</svg>
