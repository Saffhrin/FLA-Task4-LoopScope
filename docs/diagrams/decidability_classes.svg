<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Language classes relevant to the halting problem</title>
  <desc id="desc">Decidable languages are contained in recognizable languages. HALT TM is recognizable but undecidable. Its complement LOOP TM is not recognizable.</desc>
  <rect width="1000" height="470" fill="white"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#172554">Where the halting problem sits</text>
  <rect x="65" y="86" width="870" height="330" rx="28" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#1e3a8a">Turing-recognizable languages</text>
  <rect x="115" y="165" width="405" height="190" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="317" y="201" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#14532d">Decidable languages</text><text x="317" y="247" text-anchor="middle" font-family="Arial" font-size="17" fill="#172033">A decider halts on every input</text><text x="317" y="285" text-anchor="middle" font-family="Arial" font-size="16" fill="#172033">Every decidable language is recognizable</text>
  <rect x="575" y="165" width="310" height="190" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="730" y="205" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#78350f">Recognizable only</text><text x="730" y="250" text-anchor="middle" font-family="Arial" font-size="18" fill="#172033">HALT_TM</text><text x="730" y="281" text-anchor="middle" font-family="Arial" font-size="15" fill="#172033">Simulation accepts when it halts</text><text x="730" y="308" text-anchor="middle" font-family="Arial" font-size="15" fill="#172033">No decider exists</text>
  <rect x="245" y="375" width="510" height="56" rx="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="500" y="410" text-anchor="middle" font-family="Arial" font-size="17" fill="#7f1d1d">LOOP_TM = complement of HALT_TM is not recognizable</text>
</svg>
