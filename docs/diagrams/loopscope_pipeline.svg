<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">LoopScope analysis pipeline</title>
  <desc id="desc">Source program is checked against the restricted grammar, then analyzed as unbounded integers or under a finite-width model. Unsupported programs return unknown.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <rect width="1000" height="590" fill="#fff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172554">LoopScope: analysis pipeline</text>
  <g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#172033" stroke="#334155" stroke-width="2">
    <rect x="355" y="75" width="290" height="68" rx="12" fill="#eff6ff"/><text x="500" y="105" stroke="none">Program source +</text><text x="500" y="128" stroke="none">integer model</text>
    <rect x="355" y="192" width="290" height="72" rx="12" fill="#f8fafc"/><text x="500" y="222" stroke="none">Check restricted grammar</text><text x="500" y="245" stroke="none">one variable · one guard · one update</text>
    <rect x="48" y="365" width="260" height="78" rx="12" fill="#fee2e2"/><text x="178" y="397" stroke="none">UNKNOWN</text><text x="178" y="422" stroke="none">unsupported source form</text>
    <rect x="370" y="333" width="260" height="78" rx="12" fill="#dcfce7"/><text x="500" y="365" stroke="none">Unbounded integer proof</text><text x="500" y="390" stroke="none">HALTS or LOOPS</text>
    <rect x="692" y="365" width="260" height="78" rx="12" fill="#fef3c7"/><text x="822" y="397" stroke="none">Optional finite-width run</text><text x="822" y="422" stroke="none">HALTS or repeated-state LOOPS</text>
    <rect x="300" y="500" width="400" height="55" rx="12" fill="#e0e7ff"/><text x="500" y="534" stroke="none">Every verdict names the model and its evidence</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M500 143 L500 190"/><path d="M390 264 C330 300 260 320 200 362"/><path d="M500 264 L500 330"/><path d="M610 264 C675 300 742 320 800 362"/><path d="M500 411 L500 495"/><path d="M822 443 C790 480 740 508 702 522"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#334155"><text x="267" y="306">no match</text><text x="510" y="302">match</text><text x="707" y="306">separate semantics</text></g>
</svg>
